# Dependency updates, proposed rather than applied.
#
# Once a week, one pull request per ecosystem carries every minor and patch
# update, so the lock files change once and nothing has to be rebased against
# a sibling. Major updates still come one by one. Security updates do not wait
# for the schedule: Dependabot raises them as soon as an advisory is published,
# grouped per ecosystem and kept apart from the weekly version updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      composer:
        applies-to: version-updates
        update-types: [minor, patch]
      composer-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
